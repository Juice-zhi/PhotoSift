<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ps-token" content="">
<title>PhotoSift 实况分拣</title>
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --panel2:#ececE8; --ink:#1c1c1e; --muted:#6c6c72; --faint:#a3a3a8; --line:#e2e2dd;
  --accent:#2563eb; --accent-ink:#fff;
  --live:#f0a020; --live-ink:#3b2500; --video:#2f6fed; --photo:#9a9aa0;
  --warn:#d9480f;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.05);
  --thumb:168px; --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111113; --panel:#1a1a1d; --panel2:#26262a; --ink:#ececf0; --muted:#9c9ca4; --faint:#66666e; --line:#2d2d32;
    --accent:#5b8cff; --accent-ink:#fff;
    --live:#ffb43a; --live-ink:#2a1a00; --video:#6b9bff; --photo:#8a8a92;
    --warn:#ff8a50;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]:not(.toast){display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
svg{flex:none}

/* ---- top bar ---- */
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;white-space:nowrap}
.brand small{color:var(--muted);font-weight:400;font-size:12.5px}
.root{color:var(--muted);font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kinds{display:flex;gap:6px;margin:0 auto}
.kind{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.kind:hover{background:var(--panel2)}
.kind .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.kind kbd{display:none}
.kind.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.kind.on .n{color:inherit;opacity:.7}
.kind[data-kind=live].on{background:var(--live);border-color:var(--live);color:var(--live-ink)}
.kind[data-kind=video].on{background:var(--video);border-color:var(--video);color:#fff}
.kind[data-kind=photo].on{background:var(--photo);border-color:var(--photo);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{width:34px;padding:0;justify-content:center}
.only-narrow{display:none}

/* ---- layout ---- */
.layout{flex:1;display:flex;min-height:0}
.side{width:232px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-weight:600}
.side-head button{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:2px 4px}
.legend{display:flex;gap:12px;padding:0 14px 8px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.days{overflow:auto;flex:1;padding:0 8px 20px}
.month{position:sticky;top:0;z-index:1;background:var(--panel);font-size:12px;color:var(--muted);padding:10px 8px 4px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.month:hover{color:var(--ink)}
.day{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;user-select:none}
.day:hover{background:var(--panel2)}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day .d{flex:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .wk{color:var(--muted);font-size:12px;margin-left:5px}
.day .c{display:flex;gap:7px;font-size:12px;font-variant-numeric:tabular-nums}
.c span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:1px;background:currentColor}
.c .l{color:var(--live)} .c .v{color:var(--video)} .c .p{color:var(--photo)}
.day.on .wk,.day.on .c span{color:var(--accent-ink)}
.side-empty{color:var(--faint);padding:20px 14px;font-size:13px}

main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.toolbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1}
.search{position:relative}
.search svg{position:absolute;left:9px;top:9px;color:var(--faint)}
.search input{padding-left:30px;width:190px}
select,input[type=search]{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:0 8px}
input[type=range]{width:90px;accent-color:var(--accent)}
.sizer{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.viewsum{color:var(--muted);font-size:12.5px;white-space:nowrap}
.progress{flex:none;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

#scroller{flex:1;overflow:auto;position:relative;padding-bottom:90px}
.section{padding:0 16px 10px;content-visibility:auto;contain-intrinsic-size:auto 640px}
.sec-head{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:14px 0 9px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.sec-head h2{font-size:16px;margin:0;font-weight:650}
.sec-head .wk{color:var(--muted)}
.sum{display:flex;gap:10px;color:var(--muted);font-size:12.5px}
.sum b{font-weight:600}
.sum .l b{color:var(--live)} .sum .v b{color:var(--video)}
.selgrp{margin-left:auto;border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:2px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));gap:8px}

.card{position:relative;cursor:pointer;border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;user-select:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid transparent;pointer-events:none}
.card.sel::after{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:1/1;background:var(--panel2);overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img{opacity:0;transition:opacity .2s}
.thumb img.ok{opacity:1}
.thumb video{opacity:0;transition:opacity .15s}
.thumb video.ok{opacity:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:11px;text-align:center;padding:8px}
.badge{position:absolute;left:6px;top:6px;z-index:1;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.badge.live{background:var(--live);color:var(--live-ink)}
.badge.video{background:rgba(10,20,45,.72);color:#fff}
.flag{position:absolute;left:6px;bottom:6px;z-index:1;height:19px;padding:0 6px;border-radius:5px;font-size:11px;line-height:19px;background:rgba(0,0,0,.6);color:#fff}
.flag.warn{background:var(--warn)}
.check{position:absolute;right:6px;top:6px;z-index:1;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);opacity:0;transition:opacity .1s;cursor:pointer;padding:0;display:grid;place-items:center;color:#fff}
.check svg{opacity:0}
.card:hover .check,body.selmode .check{opacity:1}
.card.sel .check{background:var(--accent);border-color:var(--accent);opacity:1}
.card.sel .check svg{opacity:1}
.meta{display:flex;align-items:center;gap:6px;padding:6px 8px 7px;font-size:12px;border-top:3px solid transparent}
.k-live .meta{border-top-color:var(--live)}
.k-video .meta{border-top-color:var(--video)}
.meta .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .ext{color:var(--faint);font-size:11px}
.meta .sz{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

/* ---- empty state ---- */
.empty{max-width:880px;margin:36px auto;padding:0 20px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.drop{border:2px dashed var(--line);border-radius:16px;background:var(--panel);padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.drop h1{font-size:19px;margin:6px 0 0}
.drop p{margin:0;color:var(--muted)}
.drop .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tips{background:var(--panel);border-radius:16px;padding:20px 22px;font-size:13px;line-height:1.65;box-shadow:var(--shadow)}
.tips h3{font-size:14px;margin:0 0 6px}
.tips h3+ol,.tips h3+ul{margin-top:0}
.tips ol,.tips ul{padding-left:20px;margin-bottom:14px}
.tips li{margin:2px 0}
.muted{color:var(--muted)}
.noresult{padding:60px 20px;text-align:center;color:var(--muted)}

/* ---- selection bar ---- */
.selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--ink);color:var(--panel);box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap}
.selbar[hidden]{display:none}
.selbar .btn{background:transparent;border-color:color-mix(in srgb,var(--panel) 30%,transparent);color:var(--panel)}
.selbar .btn:hover{background:color-mix(in srgb,var(--panel) 15%,transparent)}
.selbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.selbar .txt{font-variant-numeric:tabular-nums;margin-right:6px}

/* ---- viewer ---- */
.viewer{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:1fr 330px;background:#0b0b0c;color:#eee}
.viewer[hidden]{display:none}
.v-main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.v-top{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px}
.v-tabs{display:flex;gap:4px;background:#222;border-radius:9px;padding:3px}
.v-tabs:empty{display:none}
.v-tabs button{border:0;background:none;color:#bbb;height:28px;padding:0 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px}
.v-tabs button.on{background:#444;color:#fff}
.v-tabs button:disabled{opacity:.35;cursor:default}
.v-pos{color:#888;font-size:12.5px;font-variant-numeric:tabular-nums}
.v-x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#222;color:#ddd;cursor:pointer;font-size:16px}
.v-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 60px 20px}
.v-stage img,.v-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.v-stage .v-ph{position:absolute;filter:blur(6px);opacity:.5;max-width:60%;max-height:60%}
.v-err{position:relative;max-width:440px;padding:16px 18px;border-radius:10px;background:#2a1d14;color:#ffcfae;line-height:1.6}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#eee;font-size:28px;cursor:pointer}
.v-nav:hover{background:rgba(255,255,255,.16)}
.v-nav:disabled{opacity:.2;cursor:default}
.v-nav.prev{left:8px}.v-nav.next{right:8px}
.v-info{background:#161618;border-left:1px solid #26262a;padding:20px 20px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
.v-kind{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:26px;padding:0 10px;border-radius:13px;font-weight:650;font-size:12.5px}
.v-kind.k-live{background:var(--live);color:#2a1a00}
.v-kind.k-video{background:#2f6fed;color:#fff}
.v-kind.k-photo{background:#444;color:#eee}
.v-info h3{margin:0;font-size:17px;word-break:break-all}
.why{margin:0;color:#aaa;line-height:1.55}
.v-info dl{display:grid;grid-template-columns:72px 1fr;gap:7px 10px;margin:4px 0}
.v-info dt{color:#888}
.v-info dd{margin:0;word-break:break-all}
.v-info dd small{display:block;color:#777}
.v-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.v-act .btn{background:#26262a;border-color:#333;color:#eee}
.v-act .btn.primary{background:var(--accent);border-color:var(--accent)}
.v-keys{margin-top:auto;color:#666;font-size:12px;line-height:1.7}
.spinner{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- dialogs / toast / drop overlay ---- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.dlg{width:min(480px,100%);background:var(--panel);border-radius:14px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:17px}
.dlg p{margin:0}
.dlg .field{display:flex;flex-direction:column;gap:6px}
.dlg .field>span{font-weight:600;font-size:13px}
.dlg .radios{display:flex;gap:14px;flex-wrap:wrap}
.dlg label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;max-width:min(560px,90vw);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--panel);box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13px;line-height:1.5;transition:opacity .25s}
.toast[hidden]{display:block;opacity:0;pointer-events:none}
.dropov{position:fixed;inset:10px;z-index:70;border:3px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}
.dropov[hidden]{display:none}

/* ---- phone ---- */
.devlist{display:flex;flex-direction:column;gap:6px}
.devrow{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.devrow:hover{background:var(--panel2)}
.devrow b{display:block}
.devrow small{color:var(--muted)}
.folders{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto}
.stor{display:flex;flex-wrap:wrap;gap:6px 16px}
.stor>div{flex:1 0 100%;font-size:12.5px}
.dlg ol{margin:0;padding-left:20px;line-height:1.75}
.destrow{display:flex;gap:6px}
.destrow input{flex:1;min-width:0;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:0 9px}
#copyPtxt{white-space:pre-line}
.card.imp .thumb img{opacity:.5}
.tag-imp{position:absolute;right:6px;bottom:6px;z-index:1;height:19px;padding:0 6px;border-radius:5px;font-size:11px;line-height:19px;background:#1f8a4c;color:#fff}

@media (max-width:900px){
  .empty{grid-template-columns:1fr}
  .brand small,.root{display:none}
  .side{position:fixed;left:0;top:58px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .only-narrow{display:inline-flex}
  .viewer{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .v-info{max-height:38vh;border-left:0;border-top:1px solid #26262a}
  .v-stage{padding:0 8px 8px}
}
@media (max-width:640px){
  .topbar{height:auto;flex-wrap:wrap;gap:8px;padding:8px 10px}
  .brand span.t{display:none}
  #btnRescan{margin-left:auto}
  .kinds{order:9;flex:1 0 100%;margin:0}
  .kind{flex:1;justify-content:center;padding:0 6px;gap:5px}
  .side{top:0}
  #btnOpen .t,#btnPhone .t{display:none}
  .toolbar{padding:8px 10px}
  .search input{width:130px}
  .section{padding:0 10px 10px}
  .selbar{left:10px;right:10px;transform:none;flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--live)"/><circle cx="13" cy="13" r="3" fill="var(--live-ink)"/><circle cx="13" cy="13" r="6" fill="none" stroke="var(--live-ink)" stroke-width="1.6"/><circle cx="13" cy="13" r="9" fill="none" stroke="var(--live-ink)" stroke-width="1.4" stroke-dasharray="1.6 2.2"/></svg>
    <span class="t">PhotoSift</span><small>实况 · 视频分拣</small>
  </div>
  <button class="btn icon only-narrow" id="btnSide" title="日期">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
  </button>
  <span class="root" id="rootName"></span>
  <nav class="kinds" id="kinds">
    <button class="kind on" data-kind="all" title="快捷键 1">全部 <span class="n">0</span></button>
    <button class="kind" data-kind="live" title="快捷键 2"><i class="dot" style="background:var(--live)"></i>实况 <span class="n">0</span></button>
    <button class="kind" data-kind="video" title="快捷键 3"><i class="dot" style="background:var(--video)"></i>视频 <span class="n">0</span></button>
    <button class="kind" data-kind="photo" title="快捷键 4"><i class="dot" style="background:var(--photo)"></i>照片 <span class="n">0</span></button>
  </nav>
  <button class="btn icon" id="btnRescan" title="重新扫描" disabled>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M12.5 1.5v3h-3"/></svg>
  </button>
  <button class="btn" id="btnPhone" title="直接读取用数据线连接的手机">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="1.5" width="8" height="13" rx="1.8"/><path d="M7 12.2h2"/></svg>
    <span class="t">连接手机</span>
  </button>
  <button class="btn primary" id="btnOpen">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1.5 4.5v8a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H8L6.5 3.5h-4a1 1 0 0 0-1 1z"/></svg>
    <span class="t">打开文件夹</span>
  </button>
</header>

<div class="layout">
  <aside class="side" id="side">
    <div class="side-head">按天查看 <button id="btnAllDays" title="显示全部日期">全部日期</button></div>
    <div class="legend"><span><i class="dot" style="background:var(--live)"></i>实况</span><span><i class="dot" style="background:var(--video)"></i>视频</span><span><i class="dot" style="background:var(--photo)"></i>照片</span></div>
    <div class="days" id="dayList"><div class="side-empty">打开文件夹后，这里会按拍摄日期列出每一天。<br><br>点击某天只看那天；按住 Ctrl 可多选，Shift 选连续几天。</div></div>
  </aside>

  <main>
    <div class="toolbar" id="toolbar">

function setProgress(text, frac) {
  const p = $('#progress');
  if (text == null) { p.hidden = true; return; }
  p.hidden = false;
  $('#ptxt').textContent = text;
  $('#pbar').style.width = frac == null ? '0' : Math.round(frac * 100) + '%';

async function walkHandle(dh, prefix, out, token) {
  for await (const [name, h] of dh.entries()) {
    if (token !== state.scanToken) return;
    if (h.kind === 'directory') { if (!SKIP_DIR.test(name)) await walkHandle(h, prefix + name + '/', out, token); }
    else {
      out.push({ name, path: prefix + name, handle: h });
      if (out.length % 250 === 0) setProgress(`正在读取文件列表… ${out.length}`);
    }
  }
}
async function walkEntry(entry, prefix, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ name: file.name, path: prefix + file.name, file });
  } else if (entry.isDirectory && !SKIP_DIR.test(entry.name)) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const ch of batch) await walkEntry(ch, prefix + entry.name + '/', out);
    }
  }
}

async function scanHandle(h) {
  const token = ++state.scanToken;
  setProgress('正在读取文件列表…');
  const entries = [];
  try { await walkHandle(h, '', entries, token); }
  catch (e) { setProgress(null); toast('读取文件夹失败：' + e.message); return; }
  if (token !== state.scanToken) return;
  state.rootHandle = h;
  await ingest(entries, h.name, token);
}

  for (const r of state.recs) if (r.thumb) URL.revokeObjectURL(r.thumb);
  thumbQ.queue.length = 0;
  state.items = []; state.recs = []; state.byId = new Map(); state.selected.clear(); state.filter.days.clear();
  state.rootName = rootName; state.source = src; state.phase = 'scan';
  $('#rootName').textContent = rootName ? (src ? '📱 ' : '📁 ') + rootName : '';
  $('#rootName').title = rootName;
  for (const o of document.querySelectorAll('#fSpecial option[data-dev]')) o.hidden = !src;
  if (!src && ['new', 'imported'].includes(state.filter.special)) { state.filter.special = 'all'; $('#fSpecial').value = 'all'; }
  render();

  const recs = [];
  let ignored = 0;
  for (const e of entries) {
    const name = e.name;
    if (name.startsWith('.')) continue;
    const dot = name.lastIndexOf('.');
    const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
    const media = VIDEO_EXT.has(ext) ? 'video' : IMAGE_EXT.has(ext) ? 'image' : null;
    if (!media) { ignored++; continue; }
    const slash = e.path.lastIndexOf('/');
    const f = e.file || null;
    recs.push({ name, base: dot > 0 ? name.slice(0, dot) : name, ext, media, dir: slash >= 0 ? e.path.slice(0, slash) : '', path: e.path, file: f, handle: e.handle || null,
      size: isDev(f) ? f.size : 0, mtime: 0, devDate: isDev(f) ? f.lastModified || null : null, created: e.created || 0, modified: e.modified || 0, meta: {} });
  }
  state.recs = recs;
  if (src) return ingestDevice(recs, token, src, ignored);
  let done = 0, lastPaint = 0;
  setProgress(`正在分析 0 / ${recs.length}`, 0);
  await pool(recs, 8, async r => {
    if (token !== state.scanToken) return;
    try {
      if (!r.file) r.file = await r.handle.getFile();
      r.size = r.file.size; r.mtime = r.file.lastModified;
      r.meta = r.media === 'video' ? await parseMovie(r.file) : await parseImage(r.file, r.ext);
    } catch (e) { r.meta = { error: String(e) }; }
    done++;
    const now = performance.now();
    if (now - lastPaint > 120) { lastPaint = now; setProgress(`正在分析 ${done} / ${recs.length}`, done / recs.length); }
  });
  if (token !== state.scanToken) return;
  setProgress(null);
  state.recs = recs.filter(r => r.file);
  state.phase = 'idle';
  publish(state.recs, true);
  const c = countOf(state.items);
  if (!state.items.length) toast('这个文件夹里没有找到照片或视频。');
  else toast(`扫描完成：实况 ${c.live} · 视频 ${c.video} · 照片 ${c.photo}` + (ignored ? `（另有 ${ignored} 个非媒体文件，如 .AAE，已忽略）` : ''));
}

// (Re)classify and redraw, keeping thumbnails, selection, scroll position and the open viewer.
function publish(recs, fresh = false) {
  const selMain = new Set([...state.selected].map(id => state.byId.get(id)?.main).filter(Boolean));
  const viewing = $('#viewer').hidden ? null : state.view[V.idx]?.main;
  state.items = classify(recs);
  state.byId = new Map(state.items.map(it => [it.id, it]));
  state.selected = new Set(state.items.filter(it => selMain.has(it.main)).map(it => it.id));
  thumbQ.queue.length = 0;   // the new cards re-request what is on screen
  markImported();
  $('#btnRescan').disabled = !(state.rootHandle || state.source);
  const sc = $('#scroller'), top = sc.scrollTop;
  render();
  sc.scrollTop = fresh ? 0 : top;
  if (viewing) {
    const i = state.view.findIndex(x => x.main === viewing);
    if (i >= 0) { V.idx = i; renderInfo(state.view[i]); $('#vPos').textContent = `${i + 1} / ${state.view.length}`; }

// Phone: show the list right away (names pair Live Photos, the phone supplies dates), then read
// durations / capture times / Live markers from the files in the background, most useful first.
async function ingestDevice(recs, token, src, ignored) {
  const ck = r => `${src.key}|${r.path}|${r.size}`;
  const cache = await metaCache.load(src.key + '|');
  for (const r of recs) { const m = cache.get(ck(r)); if (m) { r.meta = m; r.parsed = true; } }
  await loadImported();
  if (token !== state.scanToken) return;
  publish(recs, true);
  const c = countOf(state.items);
  if (!recs.length) { setProgress(null); state.phase = 'idle'; toast('手机的这些文件夹里没有找到照片或视频。'); return; }
  toast(`读取完成：实况 ${c.live} · 视频 ${c.video} · 照片 ${c.photo}` + (ignored ? `（另有 ${ignored} 个非媒体文件已忽略）` : ''));

  const groups = new Map();
  for (const r of recs) { const k = pairKey(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  const named = new Set();   // already has a same-name partner, so it is a Live Photo either way
  for (const g of groups.values()) if (g.some(r => r.media === 'image') && g.some(r => r.media === 'video')) for (const r of g) named.add(r);
  const todo = recs.filter(r => !r.parsed);
  const stages = [
    todo.filter(r => r.media === 'video' && !named.has(r)),   // durations, orphan Live videos
    todo.filter(r => r.media === 'image' && !named.has(r)),   // Android motion photos, capture times
    todo.filter(r => named.has(r)),
  ];
  let done = 0, lastPaint = 0;
  state.phase = 'meta';
  for (const list of stages) {
    if (!list.length) continue;
    await pool(list, 3, async r => {
      if (token !== state.scanToken) return;
      try { r.meta = r.media === 'video' ? await parseMovie(r.file) : await parseImage(r.file, r.ext); r.parsed = true; }
      catch (e) { r.meta = { error: String(e) }; }
      done++;
      const now = performance.now();
      if (now - lastPaint > 200) { lastPaint = now; setProgress(`正在读取视频时长和拍摄时间 ${done} / ${todo.length}（可以先浏览、筛选和导入）`, done / todo.length); }
    });
    if (token !== state.scanToken) return;
    publish(recs);
    metaCache.save(list.filter(r => r.parsed).map(r => [ck(r), r.meta]));
  }
  setProgress(null);
  state.phase = 'idle';
  pumpThumbs();
}

async function scanDevice(d, roots) {
  const token = ++state.scanToken;
  devBroken = false;
  state.rootHandle = null;
  state.lastDevice = { d, roots };
  setProgress(`正在读取「${d.name}」的文件列表…`);
  const entries = [];
  let err = null;
  try {
    const r = await api('/api/scan', { dev: d.id, roots }, { raw: true });
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (token !== state.scanToken) { reader.cancel(); return; }
      if (done) break;
      buf += value;
      for (let i; (i = buf.indexOf('\n')) >= 0;) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (!line) continue;
        const m = JSON.parse(line);
        if (m.t === 'f') entries.push({ name: m.n, path: m.p, file: new DevFile(d.id, m.id, m.n, m.s, m.c || m.m || 0), created: m.c, modified: m.m });
        else if (m.t === 'p') setProgress(`正在读取「${d.name}」的文件列表… 已找到 ${m.n} 个文件`);
        else if (m.t === 'err') err = m.msg;
      }
    }
  } catch (e) { err = e.code || e.message; }
  if (token !== state.scanToken) return;
  if (err && !entries.length) { setProgress(null); toast('读取手机失败：' + deviceErr(err), 9000); return; }
  if (err) toast('读到一半出错了，下面只显示已读到的部分：' + deviceErr(err), 9000);
  ingest(entries, d.name, token, { dev: d.id, name: d.name, key: d.name });
}

// ============================================================================
// filtering & grouping
// ============================================================================
function matches(it, { ignoreDays = false, ignoreKind = false } = {}) {
  const f = state.filter;
  if (!ignoreKind && f.kind !== 'all' && it.kind !== f.kind) return false;
  if (!ignoreDays && f.days.size && !f.days.has(it.dayKey)) return false;
  if (f.dur !== 'all') {
    if (it.kind !== 'video') return false;
    const [lo, hi] = DUR[f.dur], d = it.duration ?? 0;
    if (d < lo || d >= hi) return false;
  }
  switch (f.special) {
    case 'orphan': if (!it.orphan) return false; break;
    case 'embedded': if (!it.embedded) return false; break;
    case 'screen': if (!it.sub) return false; break;
    case 'noscreen': if (it.sub) return false; break;
    case 'nodate': if (!it.noDate) return false; break;
    case 'new': if (it.imported) return false; break;
    case 'imported': if (!it.imported) return false; break;
  }
  if (f.q && !it.search.includes(f.q)) return false;
  return true;
}
const SORTS = {
  'time-desc': (a, b) => b.ts - a.ts || b.id - a.id,
  'time-asc': (a, b) => a.ts - b.ts || a.id - b.id,
  size: (a, b) => b.size - a.size,
  dur: (a, b) => (b.duration ?? -1) - (a.duration ?? -1) || b.ts - a.ts,
  name: (a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }),
};
function buildGroups() {
  const list = state.items.filter(it => matches(it)).sort(SORTS[state.sort]);
  if (state.group === 'none') return list.length ? [{ key: 'all', title: '全部', wk: '', items: list }] : [];
  const map = new Map();
  for (const it of list) {
    const k = state.group === 'day' ? it.dayKey : it.monthKey;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(it);
  }
  const keys = [...map.keys()].sort();
  if (state.sort !== 'time-asc') keys.reverse();
  return keys.map(k => {
    if (state.group === 'day') { const d = dayInfo(k); return { key: k, title: d.title, wk: d.wk, items: map.get(k) }; }
    const [y, m] = k.split('-').map(Number);
    return { key: k, title: `${y}年${m}月`, wk: '', items: map.get(k) };
  });
}
function countOf(items) {
  const c = { live: 0, video: 0, photo: 0, size: 0, dur: 0 };
  for (const it of items) { c[it.kind]++; c.size += it.size; if (it.kind === 'video') c.dur += it.duration || 0; }
  return c;
}
function sumHTML(c) {
  const parts = [];
  if (c.live) parts.push(`<span class="l"><b>${c.live}</b> 实况</span>`);
  if (c.video) parts.push(`<span class="v"><b>${c.video}</b> 视频${c.dur ? ' · ' + fmtDur(c.dur) : ''}</span>`);
  if (c.photo) parts.push(`<span><b>${c.photo}</b> 照片</span>`);
  parts.push(`<span>${fmtSize(c.size)}</span>`);
  return parts.join('');
}

function renderDays() {

    counts.get(it.dayKey)[it.kind]++;

  const kind = state.filter.kind;

      + (c.live && show('live') ? `<span class="l">${c.live}</span>` : '')
      + (c.video && show('video') ? `<span class="v">${c.video}</span>` : '')
      + (c.photo && show('photo') ? `<span class="p">${c.photo}</span>` : '')
      + '</span></div>';
  }
  el.innerHTML = html;
}

  $('#copyGo').hidden = false;
  $('#copyGo').disabled = false;
  $('#copyGo').textContent = dev ? '开始导入' : '选择目标文件夹并开始';
  $('#copyCancel').textContent = '取消';
  $('#copyDlg').hidden = false;
}
function copyLocked(on) {
  for (const el of document.querySelectorAll('#copyDlg select, #copyDlg input')) el.disabled = on;
  $('#copyBrowse').disabled = on;
}
// Phone → PC through the helper, which also stamps each file with its capture time.
async function runImport() {
  const dest = $('#copyDest').value.trim().replace(/^"(.*)"$/, '$1');
  if (!/^([a-z]:\\|\\\\[^\\]+\\)/i.test(dest)) { toast('请填写完整的目标文件夹路径（例如 D:\\照片\\iPhone），或点「浏览…」选择。', 6000); return; }
  if (devBroken) { toast(deviceErr('outofstep'), 12000); return; }
  const layout = $('#copyLayout').value;
  const live = document.querySelector('input[name=copyLive]:checked').value;
  prefs.set('copyLayout', layout);
  const items = [], owners = [];
  for (const it of copyItems) for (const r of recsToCopy(it, live)) {
    items.push({ id: r.file.id, rel: [...subdirs(it, layout), r.name].join('/'), size: r.size, ts: Math.round(it.ts) });
    owners.push([it, r]);
  }
  let job;
  const release = holdDevice();
  try { job = await api('/api/import', { dev: state.source.dev, dest, items }); }
  catch (e) {
    release();
    if (e.code === 'nospace') toast(`目标磁盘空间不够：需要 ${fmtSize(e.data.need)}，只剩 ${fmtSize(e.data.free)}。`, 8000);
    else if (e.code === 'dest') toast('无法使用这个文件夹' + (e.data.detail ? '：' + e.data.detail : '。'), 8000);
    else toast('无法开始导入：' + deviceErr(e), 8000);
    return;
  }
  prefs.set('lastDest', job.dest);
  importJob = job.job;
  $('#copyProg').hidden = false;
  $('#copyGo').disabled = true;
  $('#copyCancel').textContent = '停止';
  copyLocked(true);
  let s = null, misses = 0;
  while (true) {
    await new Promise(r => setTimeout(r, 400));
    try { s = await api('/api/job?id=' + importJob); misses = 0; }
    catch (e) { if (++misses > 10) { s = { state: 'error', error: e.code || e.message, done: 0, files: items.length, ok: [] }; break; } continue; }
    $('#copyPbar').style.width = Math.round(s.bytes / (s.total || 1) * 100) + '%';
    $('#copyPtxt').textContent = `${s.done} / ${s.files} 个文件 · ${fmtSize(s.bytes)} / ${fmtSize(s.total)}` + (s.skipped ? ` · 已存在跳过 ${s.skipped}` : '') + (s.failed ? ` · 失败 ${s.failed}` : '') + (s.current ? `\n正在导入 ${s.current}` : '');
    if (s.state !== 'running') break;
  }
  importJob = null;
  release();
  if (s.error === 'outofstep') devBroken = true;
  copyLocked(false);
  $('#copyPtxt').style.whiteSpace = 'pre-line';
  if (s.failed && s.errors?.length) $('#copyPtxt').textContent += '\n失败的文件：\n' + s.errors.slice(0, 5).join('\n') + (s.errors.length > 5 ? '\n…' : '');
  // Mark what is now on the PC.
  state.imported ||= new Set();
  for (const i of s.ok || []) state.imported.add(impKey(owners[i][1]));
  markImported();
  const top = $('#scroller').scrollTop;
  renderGrid(); renderKinds(); renderDays();
  $('#scroller').scrollTop = top;
  $('#copyGo').hidden = true;
  $('#copyCancel').textContent = '关闭';
  $('#copyOpen').hidden = false;
  $('#copyOpen').onclick = () => api('/api/reveal', { path: job.dest }).catch(() => {});
  const okNew = (s.ok || []).length - s.skipped;
  if (s.state === 'done') toast(`导入完成：${okNew} 个新文件` + (s.skipped ? `，${s.skipped} 个之前导入过、已跳过` : '') + (s.failed ? `，${s.failed} 个失败（原因见导入窗口）` : '') + ` → ${job.dest}`, 8000);
  else if (s.state === 'cancelled') toast(`已停止：导入了 ${okNew} 个文件。再导入一次会自动跳过已导入的。`, 8000);
  else toast(`导入中断：${deviceErr(s.error)} 已导入 ${okNew} 个，重新连接后再导入一次会自动跳过它们。`, 10000);
  if (s.failed && s.errors?.length) console.warn('import errors', s.errors);
}
async function runCopy() {
  const layout = $('#copyLayout').value;
  const live = document.querySelector('input[name=copyLive]:checked').value;
  prefs.set('copyLayout', layout);
  let dest;
  try { dest = await window.showDirectoryPicker({ id: 'photosift-dest', mode: 'readwrite' }); }
  catch (e) { if (e.name !== 'AbortError') toast('无法使用这个文件夹：' + e.message); return; }
  const jobs = [];
  for (const it of copyItems) for (const r of recsToCopy(it, live)) jobs.push({ it, r });
  const total = jobs.reduce((s, j) => s + j.r.size, 0) || 1;
  let bytes = 0, done = 0, skipped = 0, failed = 0, raf = 0;
  const paint = () => {
    raf = 0;
    $('#copyPbar').style.width = Math.round(bytes / total * 100) + '%';
    $('#copyPtxt').textContent = `${done} / ${jobs.length} 个文件 · ${fmtSize(bytes)} / ${fmtSize(total)}` + (skipped ? ` · 跳过 ${skipped}` : '') + (failed ? ` · 失败 ${failed}` : '');
  };
  const update = () => { raf ||= requestAnimationFrame(paint); };
  $('#copyProg').hidden = false;
  $('#copyGo').disabled = true;
  $('#copyCancel').textContent = '停止';
  copyAbort = new AbortController();
  const dirs = new Map();
  const getDir = async parts => {
    let h = dest, key = '';
    for (const p of parts) {
      key += '/' + p;
      if (!dirs.has(key)) dirs.set(key, await h.getDirectoryHandle(p, { create: true }));
      h = dirs.get(key);
    }
    return h;
  };
  const exists = async (dir, name) => { try { return await (await dir.getFileHandle(name)).getFile(); } catch { return null; } };
  for (const { it, r } of jobs) {
    if (copyAbort.signal.aborted) break;
    try {
      const dir = await getDir(subdirs(it, layout));
      let name = r.name;
      const ex = await exists(dir, name);
      if (ex) {
        if (ex.size === r.size) { skipped++; done++; bytes += r.size; update(); continue; }
        for (let i = 1; await exists(dir, name); i++) name = `${r.base} (${i}).${r.ext}`;
      }
      const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
      const count = new TransformStream({ transform(chunk, ctl) { bytes += chunk.byteLength; update(); ctl.enqueue(chunk); } });
      await r.file.stream().pipeThrough(count).pipeTo(w, { signal: copyAbort.signal });
      done++;
    } catch (e) {
      if (copyAbort.signal.aborted) break;
      failed++;
      console.warn('copy failed', r.path, e);
    }
    update();
  }
  paint();
  const stopped = copyAbort.signal.aborted;
  copyAbort = null;
  $('#copyCancel').textContent = '关闭';
  toast(stopped ? `已停止：复制了 ${done} 个文件。` : `复制完成：${done - skipped} 个新文件` + (skipped ? `，${skipped} 个已存在被跳过` : '') + (failed ? `，${failed} 个失败` : '') + ` → ${dest.name}`, 6000);
}
function exportCSV(items) {
  const rows = [['类型', '日期', '时间', '名称', '照片文件', '视频文件', '视频时长(秒)', '大小(MB)', '文件夹', '判定依据', '时间来源', '创建时间', '修改时间']];
  const K = { live: '实况', video: '视频', photo: '照片' };
  const stamp = ts => ts ? `${dayKeyOf(ts)} ${fmtTime(ts)}` : '';
  for (const it of items) {
    const ft = fileTimes(it.main);
    rows.push([K[it.kind] + (it.orphan ? '(缺照片)' : it.embedded ? '(内嵌)' : ''), it.dayKey, fmtTime(it.ts), it.name, it.image?.name || '', it.video?.name || '', it.duration != null ? it.duration.toFixed(1) : '', (it.size / 1048576).toFixed(2), it.dir, it.reason, it.dateSrc, stamp(ft.created), stamp(ft.modified)]);
  }
  const csv = '﻿' + rows.map(r => r.map(c => /[",\r\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${state.rootName || '媒体'}-清单.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ============================================================================
// events
// ============================================================================
function setKind(k) { state.filter.kind = k; render(); $('#scroller').scrollTop = 0; }

$('#btnOpen').onclick = pickFolder;
$('#btnPhone').onclick = openDevices;
$('#devRefresh').onclick = openDevices;
$('#devClose').onclick = () => { $('#devDlg').hidden = true; };
$('#btnRescan').onclick = () => {
  if (state.source && state.lastDevice) scanDevice(state.lastDevice.d, state.lastDevice.roots);
  else if (state.rootHandle) scanHandle(state.rootHandle);
};
$('#btnSide').onclick = () => $('#side').classList.toggle('open');
$('#kinds').onclick = e => { const b = e.target.closest('.kind'); if (b) setKind(b.dataset.kind); };
$('#btnAllDays').onclick = () => { state.filter.days.clear(); render(); };
$('#dirInput').onchange = e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  const root = (files[0].webkitRelativePath || '').split('/')[0] || '所选文件';
  const entries = [];
  for (const f of files) {
    const rel = f.webkitRelativePath || f.name;
    const path = rel.includes('/') ? rel.slice(rel.indexOf('/') + 1) : rel;
    if (path.split('/').slice(0, -1).some(seg => SKIP_DIR.test(seg))) continue;
    entries.push({ name: f.name, path, file: f });
  }
  state.rootHandle = null;
  ingest(entries, root, ++state.scanToken);
};

let qTimer;
$('#q').oninput = e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.filter.q = e.target.value.trim().toLowerCase(); render(); }, 160); };
$('#fDur').onchange = e => { state.filter.dur = e.target.value; render(); };
$('#fSpecial').onchange = e => { state.filter.special = e.target.value; render(); };
$('#fGroup').onchange = e => { state.group = e.target.value; prefs.set('group', state.group); render(); };
$('#fSort').onchange = e => { state.sort = e.target.value; prefs.set('sort', state.sort); render(); };
$('#fSize').oninput = e => { document.documentElement.style.setProperty('--thumb', e.target.value + 'px'); prefs.set('thumb', +e.target.value); };
$('#btnSelAll').onclick = () => selectItems(state.view);
$('#btnCsv').onclick = () => state.view.length ? exportCSV(state.view) : toast('当前列表是空的。');
$('#btnCsvSel').onclick = () => exportCSV(state.view.filter(it => state.selected.has(it.id)).concat([...state.selected].map(id => state.byId.get(id)).filter(it => it && !state.view.includes(it))));
$('#btnClearSel').onclick = clearSel;
$('#btnCopy').onclick = () => openCopy([...state.selected].map(id => state.byId.get(id)).filter(Boolean));
$('#copyGo').onclick = () => state.source ? runImport() : runCopy();
$('#copyCancel').onclick = () => {
  if (copyAbort) copyAbort.abort();
  else if (importJob) { api('/api/job-cancel', { job: importJob }).catch(() => {}); $('#copyCancel').textContent = '正在停止…'; }
  else $('#copyDlg').hidden = true;
};
$('#copyBrowse').onclick = async () => {
  try {
    const r = await api('/api/pick-folder', { initial: $('#copyDest').value.trim() });
    if (r.path) $('#copyDest').value = r.path;
  } catch (e) { toast(e.code === 'busy' ? '选择文件夹的窗口已经打开了（可能在浏览器后面）。' : '无法打开选择窗口：' + deviceErr(e)); }
};

$('#dayList').onclick = e => {
  const f = state.filter.days;
  const m = e.target.closest('.month');
  if (m) {
    const ks = state.visibleDays.filter(k => k.startsWith(m.dataset.month));
    const allOn = ks.every(k => f.has(k));
    if (!(e.ctrlKey || e.metaKey)) f.clear();
    for (const k of ks) allOn && (e.ctrlKey || e.metaKey) ? f.delete(k) : f.add(k);
    if (allOn && !(e.ctrlKey || e.metaKey) && f.size === ks.length) f.clear();
    render(); $('#scroller').scrollTop = 0;
    return;
  }
  const d = e.target.closest('.day');
  if (!d) return;
  const k = d.dataset.day;
  if (e.ctrlKey || e.metaKey) f.has(k) ? f.delete(k) : f.add(k);
  else if (e.shiftKey && state.lastDay) {
    const vd = state.visibleDays;
    let a = vd.indexOf(state.lastDay), b = vd.indexOf(k);
    if (a > b) [a, b] = [b, a];
    if (a >= 0) for (let i = a; i <= b; i++) f.add(vd[i]);
  } else if (f.size === 1 && f.has(k)) f.clear();
  else { f.clear(); f.add(k); }
  state.lastDay = k;
  render();
  $('#scroller').scrollTop = 0;
  if (window.innerWidth <= 900) $('#side').classList.remove('open');
};

const sc = $('#scroller');
sc.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'open') pickFolder();
    else if (act.dataset.act === 'phone') openDevices();
    else if (act.dataset.act === 'reset') {
      Object.assign(state.filter, { kind: 'all', q: '', dur: 'all', special: 'all' });
      state.filter.days.clear();
      $('#q').value = ''; $('#fDur').value = 'all'; $('#fSpecial').value = 'all';
      render();
    }
    return;
  }
  const g = e.target.closest('.selgrp');
  if (g) { const grp = state.groups.find(x => x.key === g.dataset.key); if (grp) selectItems(grp.items); return; }
  const card = e.target.closest('.card');
  if (!card) return;
  const id = +card.dataset.id;
  if (e.shiftKey && state.lastClicked != null) {
    const ids = state.view.map(i => i.id);
    let a = ids.indexOf(state.lastClicked), b = ids.indexOf(id);
    if (a > b) [a, b] = [b, a];
    if (a >= 0) for (let i = a; i <= b; i++) setSel(ids[i], true);
  } else if (e.target.closest('.check') || e.ctrlKey || e.metaKey || state.selected.size) {
    setSel(id, !state.selected.has(id));
  } else {
    openViewer(id);
    return;
  }
  state.lastClicked = id;
  renderSelbar();
});
sc.addEventListener('dblclick', e => {
  const card = e.target.closest('.card');
  if (card && !e.target.closest('.check')) { window.getSelection()?.removeAllRanges(); openViewer(+card.dataset.id); }
});
sc.addEventListener('pointerover', e => {
  const card = e.target.closest('.card');
  if (!card || hover?.card === card) return;
  clearTimeout(hoverTimer);
  const it = state.byId.get(+card.dataset.id);
  if (!it || it.noPlay || !(it.video || it.embedded)) return;
  hoverTimer = setTimeout(() => startHover(card, it), 250);
});
sc.addEventListener('pointerout', e => {
  const card = e.target.closest('.card');
  if (card && !card.contains(e.relatedTarget)) { clearTimeout(hoverTimer); if (hover?.card === card) stopHover(); }
});

$('#vClose').onclick = closeViewer;
$('#vPrev').onclick = () => stepViewer(-1);
$('#vNext').onclick = () => stepViewer(1);
$('#vTabs').onclick = e => { const b = e.target.closest('button[data-mode]'); if (b && !b.disabled) { V.mode = b.dataset.mode; showViewer(); } };
$('#vInfo').onclick = e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const it = state.view[V.idx];
  if (b.dataset.act === 'vsel') { setSel(it.id, !state.selected.has(it.id)); renderSelbar(); renderInfo(it); }
  else if (b.dataset.act === 'vpath') {
    const txt = [it.image, it.video].filter(Boolean).map(fullPath).join('\n');
    navigator.clipboard?.writeText(txt).then(() => toast('已复制路径'), () => toast(txt));
  }
};

document.addEventListener('keydown', e => {
  if (!$('#viewer').hidden) {
    const it = state.view[V.idx];
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') stepViewer(-1);
    else if (e.key === 'ArrowRight') stepViewer(1);
    else if (e.key === ' ' && it && e.target.tagName !== 'VIDEO') { e.preventDefault(); setSel(it.id, !state.selected.has(it.id)); renderSelbar(); renderInfo(it); }
    else if ((e.key === 'l' || e.key === 'L') && it?.kind === 'live' && it.image) { V.mode = V.mode === 'photo' ? 'motion' : 'photo'; showViewer(); }
    return;
  }
  if (!$('#copyDlg').hidden) { if (e.key === 'Escape' && !copyAbort && !importJob) $('#copyDlg').hidden = true; return; }
  if (!$('#devDlg').hidden) { if (e.key === 'Escape') $('#devDlg').hidden = true; return; }
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey) {
    if (e.key.toLowerCase() === 'a' && state.view.length) { e.preventDefault(); for (const it of state.view) setSel(it.id, true); renderSelbar(); }
    return;
  }
  if (e.altKey) return;
  const k = { 1: 'all', 2: 'live', 3: 'video', 4: 'photo' }[e.key];
  if (k) setKind(k);
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape') clearSel();
});

// drag & drop a folder anywhere
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#dropov').hidden = false; } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#dropov').hidden = true; } });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0; $('#dropov').hidden = true;
  const items = [...e.dataTransfer.items].filter(i => i.kind === 'file');
  if (!items.length) return;
  // Both lookups must start synchronously, before the DataTransfer is cleared.
  const handleP = items.map(i => i.getAsFileSystemHandle?.() ?? null);
  const entries = items.map(i => i.webkitGetAsEntry?.() ?? null);
  const token = ++state.scanToken;
  setProgress('正在读取文件列表…');
  try {
    const handles = handleP.every(Boolean) ? (await Promise.all(handleP)).filter(Boolean) : null;
    if (handles?.length === 1 && handles[0].kind === 'directory') { idb.set('lastRoot', handles[0]); return scanHandle(handles[0]); }
    const out = [];
    if (handles?.length) {
      for (const h of handles) h.kind === 'directory' ? await walkHandle(h, h.name + '/', out, token) : out.push({ name: h.name, path: h.name, handle: h });
    } else {
      const ents = entries.filter(Boolean);
      if (ents.length === 1 && ents[0].isDirectory) {
        const reader = ents[0].createReader();
        for (;;) { const batch = await new Promise((res, rej) => reader.readEntries(res, rej)); if (!batch.length) break; for (const ch of batch) await walkEntry(ch, '', out); }
        state.rootHandle = null;
        return ingest(out, ents[0].name, token);
      }
      for (const en of ents) await walkEntry(en, '', out);
    }
    state.rootHandle = null;
    ingest(out, `拖入的 ${items.length} 项`, token);
  } catch (err) { setProgress(null); toast('读取拖入的内容失败：' + err.message); }
});

// restore preferences
state.sort = prefs.get('sort', 'time-desc');
state.group = prefs.get('group', 'day');
$('#fSort').value = state.sort;
$('#fGroup').value = state.group;
const ts0 = prefs.get('thumb', 168);
$('#fSize').value = ts0;
document.documentElement.style.setProperty('--thumb', ts0 + 'px');
render();
if (HELPER) {
  api('/api/ping').then(r => { helperInfo = r; }).catch(() => {});
  if (location.hash === '#phone') openDevices();
}

// hook for automated tests: PhotoSift.ingest([{name, path, file}], rootName)
window.PhotoSift = { ingest: (entries, root) => ingest(entries, root, ++state.scanToken), state };
})();
</script>
